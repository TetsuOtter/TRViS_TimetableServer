services:
  proxy:
    image: nginx:1.25.3-alpine-slim
    container_name: webmon-proxy
    hostname: webmon-proxy
    ports:
      - "80:80"
    networks:
      - proxy-front
      - proxy-back
    volumes:
      - type: bind
        read_only: true
        source: ./proxy/conf.d
        target: /etc/nginx/conf.d
      - type: bind
        source: ./proxy/logs
        target: /var/log/nginx
    depends_on:
      - front
      - php
  front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: webmon-front
    hostname: webmon-front
    networks:
      - proxy-front
    volumes:
      - type: bind
        read_only: true
        source: ./frontend/docker_conf/httpd.conf
        target: /usr/local/apache2/conf/httpd.conf
  php:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webmon-php
    hostname: webmon-php
    networks:
      - back-db
      - proxy-back
      - back-firebase
    ports:
      - "8080:80"
    volumes:
      - type: bind
        read_only: true
        source: ./backend
        target: /var/www/html
      # ./backend は read_only bind。イメージビルド時に composer install した
      # vendor/ を上書き（シャドウ）しないよう、ここだけ名前付きボリュームを被せる。
      # 注意: composer.json/lock 変更後にイメージを作り直しても、このボリュームが
      # 残っていると旧 vendor が居座る。`docker compose down -v` で作り直すこと。
      - type: volume
        source: webmon-php-vendor
        target: /var/www/html/vendor
      - type: bind
        source: ./backend-logs
        target: /var/log/apache2
      - type: bind
        read_only: true
        source: ./my_apache2.conf
        target: /etc/apache2/mods-enabled/my_apache2.conf
    depends_on:
      - mysql
  firebase:
    build:
      context: ./firebase
      dockerfile: Dockerfile
    container_name: webmon-firebase
    hostname: webmon-firebase
    networks:
      - back-firebase
    ports:
      - "9099:9099"
      - "4000:4000"
    volumes:
      - type: bind
        source: ./firebase/data
        target: /emulator/data
  mysql:
    image: mysql:8.0-oracle
    platform: linux/amd64
    container_name: webmon-db
    hostname: webmon-db
    networks:
      - back-db
    volumes:
      - type: bind
        read_only: true
        source: ./mysql/init_sql
        target: /docker-entrypoint-initdb.d
      - type: bind
        read_only: true
        source: ./mysql/conf.d
        target: /etc/mysql/conf.d
      - type: bind
        source: ./mysql/logs
        target: /var/log/mysql
      - type: volume
        source: webmon-db
        target: /var/lib/mysql
    env_file:
      - mysql/.env
  phpmyadmin:
    image: phpmyadmin:5.2.1
    container_name: webmon-phpmyadmin
    hostname: webmon-phpmyadmin
    ports:
      - "81:80"
    networks:
      - back-db
    environment:
      PMA_HOST: mysql
      PMA_USER: root
    # PMA_PASSWORD は mysql/.env から注入する。compose 補間 ${MYSQL_ROOT_PASSWORD}
    # はプロジェクト直下 .env / シェル由来で mysql/.env (env_file) は効かず、
    # 未設定警告 + 空パスワードになっていた。env_file を単一の出所にする。
    env_file:
      - mysql/.env
    depends_on:
      - mysql
volumes:
  webmon-db:
  webmon-php-vendor:
networks:
  proxy-front:
  proxy-back:
  back-db:
  back-firebase:

name: Frontend Tests

# PR のマージ可否判定ゲート。
# 重要: パスフィルタは付けない。required status check として常に必ず実行させ、
# 「対象ファイルに触れていないから skip → 緑」で merge gate が素通りするのを防ぐ
# (backend-tests.yml と同じ方針)。
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck (Node 24 / Yarn 4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 正準ビルドは frontend/Dockerfile の node:24.15.0-alpine + corepack yarn。
    # CI でもこのバージョンに合わせ、ローカル/本番ビルドとのドリフトを防ぐ。
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js 24.15.0
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.15.0"

      - name: Enable Corepack (Yarn 4.13.0)
        # packageManager フィールド (yarn@4.13.0) を corepack 経由で解決させる。
        # Dockerfile と同じ「corepack enable && yarn」。
        run: corepack enable

      - name: Get Yarn cache directory
        id: yarn-cache
        # Yarn Berry は既定でグローバルキャッシュ (~/.yarn/berry/cache) を使うため、
        # setup-node の cache:yarn ではなく解決済みパスを明示キャッシュする
        # (backend の `composer config cache-files-dir` と同じ手法)。
        run: echo "dir=$(yarn config get cacheFolder)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn packages
        uses: actions/cache@v5.0.5
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-node24-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-node24-

      - name: Install dependencies
        # --immutable: lockfile がズレていればここでハードに落ちる
        # (Dockerfile も yarn install --immutable で同経路)。
        run: yarn install --immutable

      - name: Prepare .env
        # Dockerfile は `COPY ./.env` を行うが .env は gitignore。
        # vite は VITE_* のみ参照するため、ダミー値の .env.sample で十分
        # (typecheck/build 用。本物の資格情報は使わない)。
        run: cp .env.sample .env

      - name: Typecheck (tsc — correctness bar)
        # このプロジェクトにはテストランナーが無い。デザインバンドルの
        # 逐語移植のため eslint は意図的に noisy で、正しさのバーは tsc。
        # lint は意図的にゲートしない (将来 lint を必須化して落とさないこと)。
        # tsc は型エラーで必ず loud に落ちるため silent-skip しようがない。
        run: ./node_modules/.bin/tsc

      - name: Build (vite)
        run: ./node_modules/.bin/vite build

      - name: Smoke check - build artifacts really produced
        # honest-green の核。vite が無音で no-op しても、tsc 緑だけでも
        # 通らないよう、実バンドルの存在と非自明なサイズを検証する。
        # (tsc exit 0) + (vite exit 0) + (実 dist 生成物) の3点で緑を担保。
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          js_count=$(find dist/assets -maxdepth 1 -name '*.js' -type f | wc -l)
          if [ "$js_count" -lt 1 ]; then
            echo "no dist/assets/*.js bundle produced"; exit 1
          fi
          total_kb=$(du -sk dist/assets | cut -f1)
          echo "dist/assets: ${js_count} js file(s), ${total_kb} KB total"
          if [ "$total_kb" -lt 100 ]; then
            echo "dist/assets too small (${total_kb} KB < 100 KB) — build likely a no-op"; exit 1
          fi
          echo "Smoke check passed."

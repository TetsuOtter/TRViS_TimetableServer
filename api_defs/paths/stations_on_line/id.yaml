path:
  get:
    summary: 1件取得する
    operationId: getStationOnLine
    description: |
      StationOnLine (路線上の駅) の情報を1件取得する

      このデータが属するProjectへのREAD権限が必要です。
    tags:
      - station_on_line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/StationOnLineId'
    responses:
      '200':
        description: 取得成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationOnLine'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  put:
    summary: 更新する
    operationId: updateStationOnLine
    description: |
      既存の StationOnLine の情報を更新する

      このデータが属するProjectへのWRITE権限が必要です。
    tags:
      - station_on_line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/StationOnLineId'
    requestBody:
      description: 更新後のStationOnLineの情報
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StationOnLine'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationOnLine'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  delete:
    summary: 削除する
    operationId: deleteStationOnLine
    description: |
      既存の StationOnLine を削除する

      このデータが属するProjectへのWRITE権限が必要です。
    tags:
      - station_on_line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/StationOnLineId'
    responses:
      '200':
        description: 削除成功
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '403':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/403_NotAllowedCommand'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

components:
  $ref: '../../api_root.yaml#/components'

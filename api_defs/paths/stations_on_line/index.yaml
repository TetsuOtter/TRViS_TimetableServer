path:
  get:
    summary: 複数件取得する
    operationId: getStationOnLineList
    description: |
      指定のLineに属する StationOnLine (路線上の駅) の情報を複数件取得する

      このデータが属するProjectへのREAD権限が必要です。
    tags:
      - station_on_line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/LineId'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageTopId'
    responses:
      '200':
        description: 取得成功
        headers:
          X-Total-Count:
            $ref: '#/components/headers/X-Total-Count'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationOnLineArray'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  post:
    summary: 作成する
    operationId: createStationOnLine
    description: |
      指定のLineに属する StationOnLine を新しく作成する

      このデータが属するProjectへのWRITE権限が必要です。
    tags:
      - station_on_line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/LineId'
    requestBody:
      description: 作成するStationOnLineの情報
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StationOnLine'
    responses:
      '201':
        description: 作成成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationOnLine'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

components:
  $ref: '../../api_root.yaml#/components'

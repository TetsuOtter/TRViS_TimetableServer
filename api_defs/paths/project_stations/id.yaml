path:
  get:
    summary: 1件取得する
    operationId: getProjectStation
    description: |
      Project Station の情報を1件取得する

      このデータが属するProjectへのREAD権限が必要です。
    tags:
      - project_station
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectStationId'
    responses:
      '200':
        description: 取得成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStation'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  put:
    summary: 更新する
    operationId: updateProjectStation
    description: |
      既存の Project Station の情報を更新する

      このデータが属するProjectへのWRITE権限が必要です。
    tags:
      - project_station
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectStationId'
    requestBody:
      description: 更新後のProject Stationの情報
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectStation'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectStation'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  delete:
    summary: 削除する
    operationId: deleteProjectStation
    description: |
      既存の Project Station を削除する

      このデータが属するProjectへのWRITE権限が必要です。
    tags:
      - project_station
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectStationId'
    responses:
      '200':
        description: 削除成功
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '403':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/403_NotAllowedCommand'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

components:
  $ref: '../../api_root.yaml#/components'

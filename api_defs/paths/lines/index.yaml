path:
  get:
    summary: 複数件取得する
    operationId: getLineList
    description: |
      指定のProjectに属する Line (路線) の情報を複数件取得する

      このProjectへのREAD権限が必要です。
    tags:
      - line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageTopId'
    responses:
      '200':
        description: 取得成功
        headers:
          X-Total-Count:
            $ref: '#/components/headers/X-Total-Count'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineArray'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  post:
    summary: 作成する
    operationId: createLine
    description: |
      指定のProjectに属する Line (路線) を新しく作成する

      このProjectへのWRITE権限が必要です。
    tags:
      - line
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    requestBody:
      description: 作成するLineの情報
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Line'
    responses:
      '201':
        description: 作成成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Line'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

components:
  $ref: '../../api_root.yaml#/components'

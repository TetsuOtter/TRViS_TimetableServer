path:
  get:
    summary: 複数件取得する
    operationId: getStopPatternRowList
    description: |
      指定のStopPatternに属する StopPatternRow (停車パターンの1行) の情報を複数件取得する

      このデータが属するProjectへのREAD権限が必要です。
    tags:
      - stop_pattern_row
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/StopPatternId'
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageTopId'
    responses:
      '200':
        description: 取得成功
        headers:
          X-Total-Count:
            $ref: '#/components/headers/X-Total-Count'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopPatternRowArray'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  post:
    summary: 作成する
    operationId: createStopPatternRow
    description: |
      指定のStopPatternに属する StopPatternRow を新しく作成する

      このデータが属するProjectへのWRITE権限が必要です。
    tags:
      - stop_pattern_row
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/StopPatternId'
    requestBody:
      description: 作成するStopPatternRowの情報 (配列で複数件指定可能)
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StopPatternRowArray'
    responses:
      '201':
        description: 作成成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopPatternRowArray'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

components:
  $ref: '../../api_root.yaml#/components'

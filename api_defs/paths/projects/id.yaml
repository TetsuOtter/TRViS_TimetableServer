path:
  get:
    summary: 1件取得する
    operationId: getProject
    description: |
      Project の情報を1件取得する

      このProjectへのREAD権限が必要です。
    tags:
      - project
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    responses:
      '200':
        description: 取得成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  put:
    summary: 更新する
    operationId: updateProject
    description: |
      既存の Project を更新する

      このProjectへのWRITE権限が必要です。
    tags:
      - project
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    requestBody:
      description: 更新後のProjectの情報
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Project'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

  delete:
    summary: 削除する
    operationId: deleteProject
    description: |
      既存の Project を削除する

      このProjectへのADMIN権限が必要です。
    tags:
      - project
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    responses:
      '200':
        description: 削除成功
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'
      '403':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/403_NotAllowedCommand'
      '404':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/404_ContentNotFound'

components:
  $ref: '../../api_root.yaml#/components'

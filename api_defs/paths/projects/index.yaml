path:
  get:
    summary: 複数件取得する
    operationId: getProjectList
    description: |
      自身が取得できる Project の情報を複数件取得する
    tags:
      - project
    security:
      - bearerAuth: []
    parameters:
      - $ref: '#/components/parameters/PageNumber'
      - $ref: '#/components/parameters/PageSize'
      - $ref: '#/components/parameters/PageTopId'
    responses:
      '200':
        description: 取得成功
        headers:
          X-Total-Count:
            $ref: '#/components/headers/X-Total-Count'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectArray'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'

  post:
    summary: 作成する
    operationId: createProject
    description: |
      Project を新しく作成する

      この操作にはサインインが必要です。
    tags:
      - project
    security:
      - bearerAuth: []
    requestBody:
      description: 作成するProjectの情報
      required: true
      content:
        application/json:
            schema:
              $ref: '#/components/schemas/Project'
    responses:
      '201':
        description: 作成成功
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Project'
      '400':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/BadRequest'
      '401':
        $ref: '../../response_objs/_errors/code_msg.yaml#/json_responses/401_TokenError'

components:
  $ref: '../../api_root.yaml#/components'

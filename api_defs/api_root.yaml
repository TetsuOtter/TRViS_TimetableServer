openapi: 3.0.3

info:
  title: TRViS用 時刻表管理用API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: ローカル開発環境(Docker)
  - url: http://localhost:8888/api/v1
    description: ローカル開発環境(ホストマシン)
  - url: https://trvis.t0r.dev/api/v1
    description: 本番環境

tags:
  - name: api_info
    description: APIの情報を取得する
  - name: auth
    description: 認証/認可関連のAPI (トークン発行など)
  - name: invite_key
    description: 招待キー関係の操作を行う
  - name: project
    description: Project (権限の最上位単位) の操作を行う
  - name: work_group
    description: Work Groupの操作を行う
  - name: line
    description: Line (路線) の操作を行う
  - name: project_station
    description: Project Station (Project内共通の駅) の操作を行う
  - name: station_on_line
    description: StationOnLine (路線上の駅) の操作を行う
  - name: stop_pattern
    description: StopPattern (停車パターン) の操作を行う
  - name: stop_pattern_row
    description: StopPatternRow (停車パターンの1行) の操作を行う
  - name: station
    description: Stationの操作を行う
  - name: station_track
    description: Station Track (各駅の番線) の操作を行う
  - name: work
    description: Work (仕業) の操作を行う
  - name: train
    description: Train (列車) の操作を行う
  - name: timetable_row
    description: TimetableRow (運転時刻表の1行) の操作を行う
  - name: color
    description: 色情報の操作を行う
  - name: dump
    description: 複数のデータをまとめて出力する

paths:
  /:
    $ref: "./paths/index.yaml#/path"

  /auths:
    $ref: "./paths/auth/index.yaml#/path"

  /projects:
    $ref: "./paths/projects/index.yaml#/path"
  /projects/{projectId}:
    $ref: "./paths/projects/id.yaml#/path"
  /projects/{projectId}/privileges:
    $ref: "./paths/projects/id_privileges.yaml#/path"
  /projects/{projectId}/work_groups:
    $ref: "./paths/projects/id_work_groups.yaml#/path"

  /projects/{projectId}/lines:
    $ref: "./paths/lines/index.yaml#/path"
  /lines/{lineId}:
    $ref: "./paths/lines/id.yaml#/path"

  /projects/{projectId}/project_stations:
    $ref: "./paths/project_stations/index.yaml#/path"
  /project_stations/{projectStationId}:
    $ref: "./paths/project_stations/id.yaml#/path"

  /lines/{lineId}/stations_on_line:
    $ref: "./paths/stations_on_line/index.yaml#/path"
  /stations_on_line/{stationOnLineId}:
    $ref: "./paths/stations_on_line/id.yaml#/path"

  /projects/{projectId}/stop_patterns:
    $ref: "./paths/stop_patterns/index.yaml#/path"
  /stop_patterns/{stopPatternId}:
    $ref: "./paths/stop_patterns/id.yaml#/path"

  /stop_patterns/{stopPatternId}/rows:
    $ref: "./paths/stop_pattern_rows/index.yaml#/path"
  /stop_pattern_rows/{stopPatternRowId}:
    $ref: "./paths/stop_pattern_rows/id.yaml#/path"

  /work_groups:
    $ref: "./paths/work_groups/index.yaml#/path"
  /work_groups/{workGroupId}:
    $ref: "./paths/work_groups/id.yaml#/path"
  /work_groups/{workGroupId}/privileges:
    $ref: "./paths/work_groups/id_privileges.yaml#/path"

  /work_groups/{workGroupId}/invite_keys:
    $ref: "./paths/invite_keys/wg_index.yaml#/path"
  /invite_keys:
    $ref: "./paths/invite_keys/index.yaml#/path"
  /invite_keys/{inviteKeyId}:
    $ref: "./paths/invite_keys/id.yaml#/path"

  /work_groups/{workGroupId}/stations:
    $ref: "./paths/stations/index.yaml#/path"
  /stations/{stationId}:
    $ref: "./paths/stations/id.yaml#/path"

  /stations/{stationId}/tracks:
    $ref: "./paths/station_tracks/index.yaml#/path"
  /tracks/{stationTrackId}:
    $ref: "./paths/station_tracks/id.yaml#/path"

  /work_groups/{workGroupId}/works:
    $ref: "./paths/works/index.yaml#/path"
  /works/{workId}:
    $ref: "./paths/works/id.yaml#/path"

  /works/{workId}/trains:
    $ref: "./paths/trains/index.yaml#/path"
  /trains/{trainId}:
    $ref: "./paths/trains/id.yaml#/path"

  /trains/{trainId}/timetable_rows:
    $ref: "./paths/timetable_rows/index.yaml#/path"
  /timetable_rows/{timetableRowId}:
    $ref: "./paths/timetable_rows/id.yaml#/path"

  /work_groups/{workGroupId}/colors:
    $ref: "./paths/colors/index.yaml#/path"
  /colors/{colorId}:
    $ref: "./paths/colors/id.yaml#/path"

  /dump/{workGroupId}:
    $ref: "./paths/dump/id.yaml#/path"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiInfo:
      $ref: "./objects/ApiInfo.yaml#/ApiInfo"
    TokenRequest:
      $ref: "./objects/TokenRequest.yaml#/TokenRequest"
    TokenResponse:
      $ref: "./objects/TokenResponse.yaml#/TokenResponse"

    InviteKey:
      $ref: "./objects/InviteKey.yaml#/InviteKey"
    InviteKeyArray:
      $ref: "./objects/InviteKey.yaml#/InviteKeyArray"

    Station:
      $ref: "./objects/Station.yaml#/Station"
    StationArray:
      $ref: "./objects/Station.yaml#/StationArray"

    StationTrack:
      $ref: "./objects/StationTrack.yaml#/StationTrack"
    StationTrackArray:
      $ref: "./objects/StationTrack.yaml#/StationTrackArray"

    TimetableRow:
      $ref: "./objects/TimetableRow.yaml#/TimetableRow"
    TimetableRowArray:
      $ref: "./objects/TimetableRow.yaml#/TimetableRowArray"

    Train:
      $ref: "./objects/Train.yaml#/Train"
    TrainArray:
      $ref: "./objects/Train.yaml#/TrainArray"

    Work:
      $ref: "./objects/Work.yaml#/Work"
    WorkArray:
      $ref: "./objects/Work.yaml#/WorkArray"

    WorkGroup:
      $ref: "./objects/WorkGroup.yaml#/WorkGroup"
    WorkGroupArray:
      $ref: "./objects/WorkGroup.yaml#/WorkGroupArray"

    Color:
      $ref: "./objects/Color.yaml#/Color"
    ColorArray:
      $ref: "./objects/Color.yaml#/ColorArray"

    TRViS_json:
      $ref: "./objects/TRViS.yaml#/TRViS_json_root"

    WorkGroupsPrivilege:
      $ref: "./objects/WorkGroupsPrivilege.yaml#/WorkGroupsPrivilege"

    Project:
      $ref: "./objects/Project.yaml#/Project"
    ProjectArray:
      $ref: "./objects/Project.yaml#/ProjectArray"
    ProjectsPrivilege:
      $ref: "./objects/ProjectsPrivilege.yaml#/ProjectsPrivilege"

    Line:
      $ref: "./objects/Line.yaml#/Line"
    LineArray:
      $ref: "./objects/Line.yaml#/LineArray"

    ProjectStation:
      $ref: "./objects/ProjectStation.yaml#/ProjectStation"
    ProjectStationArray:
      $ref: "./objects/ProjectStation.yaml#/ProjectStationArray"

    StationOnLine:
      $ref: "./objects/StationOnLine.yaml#/StationOnLine"
    StationOnLineArray:
      $ref: "./objects/StationOnLine.yaml#/StationOnLineArray"

    StopPattern:
      $ref: "./objects/StopPattern.yaml#/StopPattern"
    StopPatternArray:
      $ref: "./objects/StopPattern.yaml#/StopPatternArray"

    StopPatternRow:
      $ref: "./objects/StopPatternRow.yaml#/StopPatternRow"
    StopPatternRowArray:
      $ref: "./objects/StopPatternRow.yaml#/StopPatternRowArray"

  parameters:
    WorkGroupId:
      $ref: "./parameters/id.yaml#/WorkGroupId"
    InviteKeyId:
      $ref: "./parameters/id.yaml#/InviteKeyId"
    WorkId:
      $ref: "./parameters/id.yaml#/WorkId"
    TrainId:
      $ref: "./parameters/id.yaml#/TrainId"
    TimetableRowId:
      $ref: "./parameters/id.yaml#/TimetableRowId"
    StationId:
      $ref: "./parameters/id.yaml#/StationId"
    StationTrackId:
      $ref: "./parameters/id.yaml#/StationTrackId"
    ColorId:
      $ref: "./parameters/id.yaml#/ColorId"
    ProjectId:
      $ref: "./parameters/id.yaml#/ProjectId"
    LineId:
      $ref: "./parameters/id.yaml#/LineId"
    ProjectStationId:
      $ref: "./parameters/id.yaml#/ProjectStationId"
    StationOnLineId:
      $ref: "./parameters/id.yaml#/StationOnLineId"
    StopPatternId:
      $ref: "./parameters/id.yaml#/StopPatternId"
    StopPatternRowId:
      $ref: "./parameters/id.yaml#/StopPatternRowId"
    UidQuery:
      $ref: "./parameters/id.yaml#/UidQuery"
    UidAnonymousQuery:
      $ref: "./parameters/id.yaml#/UidAnonymousQuery"

    PageNumber:
      $ref: "./parameters/paging.yaml#/PageNumber"
    PageSize:
      $ref: "./parameters/paging.yaml#/PageSize"
    PageTopId:
      $ref: "./parameters/paging.yaml#/PageTopId"

    Expired:
      $ref: "./parameters/expired.yaml#/Expired"

  headers:
    X-Total-Count:
      $ref: "./parameters/paging.yaml#/X-Total-Count"

  '/works/{workId}':
    get:
      tags:
        - work
      summary: 1件取得する
      description: "Workを1件取得する\n\n属するWorkGroupへのREAD権限が必要です。"
      operationId: getWork
      parameters:
        -
          name: workId
          in: path

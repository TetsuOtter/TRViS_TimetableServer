        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '404':
          description: WorkGroupが見つからない
      security:
        -
          bearerAuth: []
    post:
      tags:
        - train
      summary: 作成する
      description: "指定のWorkに属する Train を新しく作成する\n\n属するWorkGroupへのWRITE権限が必要です。"
      operationId: createTrain
      parameters:

openapi: 3.0.0
info:
  title: 'TRViS用 時刻表管理用API'
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8080/api/v1'
    description: ローカル開発環境(Docker)
  -
    url: 'http://localhost:8888/api/v1'
    description: ローカル開発環境(ホストマシン)
  -
    url: 'https://trvis.t0r.dev/api/v1'
    description: 本番環境
paths:
  /:
    get:
      tags:
        - api_info
      summary: APIの情報を取得する
      description: APIのバージョン等、APIの情報を取得する
      operationId: getApiInfo
      responses:
        '200':
          description: APIの情報
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInfo'
  '/work_groups/{workGroupId}/stations':
    post:
      tags:
        - station
      summary: 作成する
      description: "指定のWorkGroupに属する Station を新しく作成する\n\n属するWorkGroupへのWRITE権限が必要です。"
      operationId: createStation
      parameters:
        -
          name: workGroupId
          in: path
          description: WorkGroupのID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Station'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Station'
        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '404':
          description: WorkGroupが見つからない
      security:
        -
          bearerAuth: []
  '/trains/{trainId}/timetable_rows':
    get:
      tags:
        - timetable_row
      summary: 複数件取得する
      description: "指定のTrainに属するTimetableRowの情報を複数件取得する\n\n属するWorkGroupへのREAD権限が必要です。"
      operationId: getTimetableRowList
      parameters:
        -
          name: trainId
          in: path
          description: TrainのID
          required: true
          schema:
            type: string
            format: uuid
        -
          name: pageNumber
          in: query
          description: 'ページ番号 (0以上)'
          required: false
          schema:
            type: integer
            minimum: 0
        -
          name: pageSize
          in: query
          description: 'ページサイズ (1以上)'
          required: false
          schema:
            type: integer
            minimum: 1
        -
          name: pageTopId
          in: query
          description: ページの先頭ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimetableRow'
        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '404':
          description: WorkGroupが見つからない
      security:
        -
          bearerAuth: []
    post:
      tags:
        - timetable_row
      summary: 作成する
      description: "指定のTrainに属する TimetableRow を新しく作成する\n\n属するWorkGroupへのWRITE権限が必要です。"
      operationId: createTimetableRow
      parameters:
        -
          name: trainId
          in: path
          description: TrainのID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableRow'
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableRow'
        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '404':
          description: WorkGroupが見つからない
      security:
        -
          bearerAuth: []
  '/timetable_rows/{timetableRowId}':
    get:
      tags:
        - timetable_row
      summary: 1件取得する
      description: "TimetableRowを1件取得する\n\n属するWorkGroupへのREAD権限が必要です。"
      operationId: getTimetableRow
      parameters:
        -
          name: timetableRowId
          in: path
          description: 'Timetable RowのID'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableRow'
        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '404':
          description: コンテンツまたはWorkGroupが見つからない
      security:
        -
          bearerAuth: []
    put:
      tags:
        - timetable_row
      summary: 更新する
      description: "既存のTimetableRowの情報を更新する\n\n属するWorkGroupへのWRITE権限が必要です。"
      operationId: updateTimetableRow
      parameters:
        -
          name: timetableRowId
          in: path
          description: 'Timetable RowのID'
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimetableRow'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableRow'
        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '404':
          description: コンテンツまたはWorkGroupが見つからない
      security:
        -
          bearerAuth: []
    delete:
      tags:
        - timetable_row
      summary: 削除する
      description: "既存のTimetableRowを削除する\n\n属するWorkGroupへのWRITE権限が必要です。"
      operationId: deleteTimetableRow
      parameters:
        -
          name: timetableRowId
          in: path
          description: 'Timetable RowのID'
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 削除成功
        '400':
          description: リクエストが不正
        '401':
          description: 認証エラー
        '403':
          description: 許可されていない操作
        '404':
          description: コンテンツまたはWorkGroupが見つからない
      security:
        -
          bearerAuth: []

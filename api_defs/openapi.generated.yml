components:
  schemas:
    ApiInfo:
      title: ApiInfo
      description: API情報
      properties:
        server_name:
          description: サーバの名前
          type: string
          readOnly: true
        version:
          description: APIのバージョン
          type: string
          readOnly: true
      type: object
    Color:
      title: Color
      description: 'Color (色) のデータ構造'
      required:
        - description
        - name
        - color_8bit
      properties:
        colors_id:
          description: 'ColorのID (UUID)'
          type: string
          format: uuid
          readOnly: true
        work_groups_id:
          description: 'この色が属するWorkGroupのID (UUID)'
          type: string
          format: uuid
          readOnly: true
        created_at:
          description: 作成日時
          type: string
          format: date-time
          readOnly: true
        updated_at:
          description: 更新日時
          type: string
          format: date-time
          readOnly: true
        description:
          description: Colorの説明
          type: string
          example: Colorの説明が入ります
        name:
          description: 'Colorの名前 (詳細な説明はdescriptionに書く)'
          type: string
          example: 赤
        color_8bit:
          $ref: '#/components/schemas/Color8bit'
        color_real:
          oneOf:
            -
              $ref: '#/components/schemas/ColorReal'
          nullable: true
          description: 色の小数表現
      type: object
    Color8bit:
      title: Color8bit
      description: 色の8bit表現
      required:
        - red
        - green
        - blue
      properties:
        red:
          description: '色の赤色成分 (8bit)'
          type: integer
          maximum: 255
          minimum: 0
          example: 127
        green:
          description: '色の緑色成分 (8bit)'
          type: integer
          maximum: 255
          minimum: 0
          example: 127
        blue:
          description: '色の青色成分 (8bit)'
          type: integer
          maximum: 255
          minimum: 0
          example: 127
      type: object
    ColorReal:
      title: ColorReal
      description: 色の小数表現
      required:
        - red
        - green
        - blue
      properties:
        red:
          description: '色の赤色成分 (小数)'
          type: number
          format: double
          maximum: 1
          minimum: 0
          example: 0.5
        green:
          description: '色の緑色成分 (小数)'
          type: number
          format: double
          maximum: 1
          minimum: 0
          example: 0.5
        blue:
          description: '色の青色成分 (小数)'
          type: number
          format: double
          maximum: 1
          minimum: 0
          example: 0.5
      type: object
    InviteKey:
      title: InviteKey
      description: 'InviteKey (招待キー) のデータ構造'
      required:
        - description
      properties:
        invite_keys_id:
          description: 'Invite Key (UUID)'
          type: string
          format: uuid
          readOnly: true
        work_groups_id:
          description: '対応するWorkGroupのID (UUID)'
          type: string
          format: uuid
          readOnly: true
        created_at:
          description: 作成日時
          type: string
          format: date-time
          readOnly: true
        description:
          description: 招待キーの説明
          type: string
          example: グループAの招待キー
        valid_from:
          description: 'キーの有効期限 (開始)'
          type: string
          format: date-time
          nullable: true
        expires_at:
          description: 'キーの有効期限 (終了)'
          type: string
          format: date-time
          nullable: true
        use_limit:
          description: キーの使用回数の上限
          type: integer
          minimum: 1
          example: 15
          nullable: true
        disabled_at:
          description: 'キーが無効になった日時 (Expireした場合はexpires_atと同じ値)'
          type: string
          format: date-time
          readOnly: true
          nullable: true
        privilege_type:
          description: 招待キーで付与される権限
          type: string
          enum:
            - read
            - write
            - admin
          example: read
          nullable: true
      type: object
    Station:
      title: Station
      description: 'Station (駅) のデータ構造'
      required:
        - description
        - name
        - location_km
        - record_type
      properties:
        stations_id:
          description: 'StationのID (UUID)'
          type: string
          format: uuid
          readOnly: true
        work_groups_id:
          description: 'WorkGroupのID (UUID)'
          type: string
          format: uuid
          readOnly: true
        created_at:
          description: 作成日時
          type: string
          format: date-time
          readOnly: true
        description:
          description: Stationの説明
          type: string
          example: Stationの説明が入ります
        name:
          description: 駅名
          type: string
          example: 東京
        location_km:
          description: '駅の位置 (km)'
          type: number
          format: double
          example: 12.345
        location_lonlat:
          oneOf:
            -
              $ref: '#/components/schemas/StationLocationLonlat'
          nullable: true
          description: '駅の位置 (緯度経度)'
        on_station_detect_radius_m:
          description: 'その駅にいるかどうかを判定する円の半径 (m)'
          type: number
          format: double
          example: 123.45
          nullable: true
        record_type:
          description: 駅の種類
          type: number
          example: 0
      type: object
    StationLocationLonlat:
      title: StationLocationLonlat

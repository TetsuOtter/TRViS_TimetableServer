          bearerAuth: []
    put:
      tags:
        - train
      summary: 更新する
      description: "既存のTrainの情報を更新する\n\n属するWorkGroupへのWRITE権限が必要です。"
      operationId: updateTrain
      parameters:
        -
          name: trainId
          in: path
          description: TrainのID
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Train'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Train'
        '400':

Line:
  type: object
  title: Line
  required:
    - description
    - name
  properties:
    lines_id:
      type: string
      format: uuid
      readOnly: true
      description: LineのID (UUID)
    projects_id:
      type: string
      format: uuid
      readOnly: true
      description: ProjectのID (UUID)
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: 作成日時
    description:
      type: string
      description: Lineの説明
      example: Lineの説明が入ります
    name:
      type: string
      description: 路線名
      example: 東海道本線

LineArray:
  type: array
  title: LineArray
  items:
    $ref: '#/Line'

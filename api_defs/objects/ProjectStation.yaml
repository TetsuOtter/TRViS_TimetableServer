ProjectStation:
  type: object
  title: ProjectStation
  required:
    - name
  properties:
    project_stations_id:
      type: string
      format: uuid
      readOnly: true
      description: Project Station (Project内共通の駅) のID (UUID)
    projects_id:
      type: string
      format: uuid
      readOnly: true
      description: ProjectのID (UUID)
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: 作成日時
    name:
      type: string
      description: 駅名
      example: 東京
    full_name:
      type: string
      description: 駅のフルネーム
      example: 東京駅
    location_lonlat:
      type: object
      description: 駅の位置 (緯度経度)
      required:
        - longitude
        - latitude
      properties:
        longitude:
          type: number
          format: double
          description: 経度
          example: 139.766944
        latitude:
          type: number
          format: double
          description: 緯度
          example: 35.681111
    on_station_detect_radius_m:
      type: number
      format: double
      description: その駅にいるかどうかを判定する円の半径 (m)
      example: 123.45
    always_show_hh:
      type: boolean
      description: 時刻表示で常に「時」を表示するかどうか
      example: false

ProjectStationArray:
  type: array
  title: ProjectStationArray
  items:
    $ref: '#/ProjectStation'

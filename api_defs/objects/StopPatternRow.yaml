StopPatternRow:
  type: object
  title: StopPatternRow
  required:
    - project_stations_id
  properties:
    stop_pattern_rows_id:
      type: string
      format: uuid
      readOnly: true
      description: StopPatternRowのID (UUID)
    stop_patterns_id:
      type: string
      format: uuid
      readOnly: true
      description: 紐づくStopPatternのID (UUID)
    projects_id:
      type: string
      format: uuid
      readOnly: true
      description: ProjectのID (UUID)
    project_stations_id:
      type: string
      format: uuid
      description: この行の駅 (Project Station) のID (UUID)
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: 作成日時
    sort_key:
      type: integer
      minimum: 0
      description: 並び順 (昇順)
      example: 0
    track_name:
      type: string
      description: 番線名
      example: 上2
    track_hidden:
      type: boolean
      description: 番線を非表示にするかどうか
      example: false
    is_operation_only_stop:
      type: boolean
      description: 運転停車かどうか
      example: false
    is_pass:
      type: boolean
      description: 通過駅かどうか
      example: false
    drive_time_mm:
      type: integer
      minimum: 0
      maximum: 99
      description: 駅間運転時間 (分)
      example: 3
    drive_time_ss:
      type: integer
      minimum: 0
      maximum: 59
      description: 駅間運転時間 (秒)
      example: 15
    dwell_time_mm:
      type: integer
      minimum: 0
      maximum: 99
      description: 停車時間 (分)
      example: 1
    dwell_time_ss:
      type: integer
      minimum: 0
      maximum: 59
      description: 停車時間 (秒)
      example: 0
    show_arrive:
      type: boolean
      description: 到着時刻を表示するかどうか
      example: true
    show_departure:
      type: boolean
      description: 出発時刻を表示するかどうか
      example: true
    arrive_str:
      type: string
      description: 到着時刻欄に表示する文字列
      example: 停車
    departure_str:
      type: string
      description: 出発時刻欄に表示する文字列
      example: '↓'
    run_in_limit:
      type: integer
      minimum: 0
      description: 進入制限 (km/h)
      example: 15
    run_out_limit:
      type: integer
      minimum: 0
      description: 進出制限 (km/h)
      example: 15
    remarks:
      type: string
      description: 注意事項
      example: 通過設定
    always_show_hh:
      type: boolean
      description: 時刻表示で常に「時」を表示するかどうか
      example: false

StopPatternRowArray:
  type: array
  title: StopPatternRowArray
  items:
    $ref: '#/StopPatternRow'

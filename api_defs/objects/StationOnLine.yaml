StationOnLine:
  type: object
  title: StationOnLine
  required:
    - lines_id
    - project_stations_id
    - location_m
  properties:
    stations_on_line_id:
      type: string
      format: uuid
      readOnly: true
      description: StationOnLineのID (UUID)
    projects_id:
      type: string
      format: uuid
      readOnly: true
      description: ProjectのID (UUID)
    lines_id:
      type: string
      format: uuid
      description: 紐づくLineのID (UUID)
    project_stations_id:
      type: string
      format: uuid
      description: 紐づくProject StationのID (UUID)
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: 作成日時
    location_m:
      type: number
      format: double
      description: その路線上での駅の位置 (m)
      example: 12345.6
    location_lonlat:
      type: object
      description: その路線上での駅の位置 (緯度経度) ※未指定時はProject Stationの値を使用
      required:
        - longitude
        - latitude
      properties:
        longitude:
          type: number
          format: double
          description: 経度
          example: 139.766944
        latitude:
          type: number
          format: double
          description: 緯度
          example: 35.681111
    track_hidden_by_default:
      type: boolean
      description: デフォルトで番線を非表示にするかどうか
      example: false

StationOnLineArray:
  type: array
  title: StationOnLineArray
  items:
    $ref: '#/StationOnLine'

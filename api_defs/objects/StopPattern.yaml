StopPattern:
  type: object
  title: StopPattern
  required:
    - name
    - lines_id
  properties:
    stop_patterns_id:
      type: string
      format: uuid
      readOnly: true
      description: StopPatternのID (UUID)
    projects_id:
      type: string
      format: uuid
      readOnly: true
      description: ProjectのID (UUID)
    lines_id:
      type: string
      format: uuid
      description: 紐づくLineのID (UUID)
    created_at:
      type: string
      format: date-time
      readOnly: true
      description: 作成日時
    name:
      type: string
      description: 停車パターンの名前
      example: 各駅停車
    from_project_stations_id:
      type: string
      format: uuid
      description: 始点のProject StationのID (UUID)
    to_project_stations_id:
      type: string
      format: uuid
      description: 終点のProject StationのID (UUID)
    direction:
      type: integer
      enum:
        - 1
        - -1
      description: 進行方向 (1=下り, -1=上り)
      example: 1

StopPatternArray:
  type: array
  title: StopPatternArray
  items:
    $ref: '#/StopPattern'
